# Connection settings come from environment variables only; no defaults, no literals
# (specs/003-dbt-transforms/research.md R3). A missing variable makes dbt exit 2.
football_analytics:
  target: default
  outputs:
    default:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST') }}"
      port: "{{ env_var('DBT_PG_PORT') | as_number }}"
      user: "{{ env_var('DBT_PG_USER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_PG_PASSWORD') }}"
      dbname: "{{ env_var('DBT_PG_DBNAME') }}"
      schema: analytics
      threads: 4
