[project]
name = "football-stats"
version = "0.1.0"
description = "Football match data ingestion pipeline (CSV to PostgreSQL)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.30,<2",
    "psycopg[binary]>=3.2,<3.3",
    "alembic>=1.16,<1.17",
    "sqlalchemy>=2.0,<2.1",
    "pandera[polars]>=0.34.1,<0.35",
]

[project.scripts]
football-stats = "football_stats.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    # capped by dbt-core 1.11's pathspec<0.13; mypy>=2 needs pathspec>=1 (003 decisions I-2)
    "mypy>=1.19.1,<2",
    "pytest>=8,<9",
    "testcontainers>=4,<5",
    "pytest-randomly",
    "pytest-socket",
    "jsonschema",
    "types-jsonschema",
    "types-pyyaml>=6.0.12.20260906",
]
transform = [
    "dbt-core>=1.11.15,<1.12",
    "dbt-postgres>=1.11.0,<1.12",
]

[tool.uv]
default-groups = ["dev", "transform"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20", "BLE", "S110", "D", "PL", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]
"migrations/**" = ["D", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers -ra"
xfail_strict = true
pythonpath = ["src"]
