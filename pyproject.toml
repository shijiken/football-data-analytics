[project]
name = "football-stats"
version = "0.1.0"
description = "Football match data ingestion pipeline (CSV to PostgreSQL)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.30,<2",
    "psycopg[binary]>=3.2,<3.3",
    "alembic>=1.16,<1.17",
    "sqlalchemy>=2.0,<2.1",
]

[project.scripts]
football-stats = "football_stats.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest>=8,<9",
    "testcontainers>=4,<5",
    "pytest-randomly",
    "pytest-socket",
    "jsonschema",
    "types-jsonschema",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20", "BLE", "S110", "D", "PL", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]
"migrations/**" = ["D", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers -ra"
xfail_strict = true
pythonpath = ["src"]
